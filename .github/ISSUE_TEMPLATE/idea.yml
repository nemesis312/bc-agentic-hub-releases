name: Suggest an idea
description: Propose a new feature or an improvement for BC Agentic Hub.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        First, search the [issues](https://github.com/nemesis312/bc-agentic-hub-releases/issues) in case someone already proposed something similar. If it's there, add your case as a comment.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Tell us what you're trying to do today and what makes it hard.
      placeholder: "When I manage skills across several projects, I have to ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like it to work in the app.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround (optional)
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: App version (optional)
      description: It's in BC Agentic Hub's About window.
      placeholder: "0.4.1"
    validations:
      required: false
