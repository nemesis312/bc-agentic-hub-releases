name: Report a bug
description: Something in BC Agentic Hub doesn't work as it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. First, search the [open issues](https://github.com/nemesis312/bc-agentic-hub-releases/issues) in case someone already reported it. If it's there, add your case as a comment.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: It's in BC Agentic Hub's About window (BC Agentic Hub menu > About).
      placeholder: "0.4.1"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu > About This Mac. Also say whether it's Apple Silicon or Intel.
      placeholder: "macOS 15.1, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that make the bug happen.
      placeholder: |
        1. Add the repo ... as a source
        2. Install the skill ... in a project
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Include the error message if there was one. You can paste screenshots.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source repo or skill involved (optional)
      description: If the bug is tied to a specific source, skill, agent or plugin, say which one.
      placeholder: "github.com/user/repo, skill my-skill"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Relevant terminal output or logs. Check that they don't include tokens, keys or private data.
      render: shell
    validations:
      required: false
